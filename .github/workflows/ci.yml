name: CI

# Triggers: ejecutar en push a main y en pull requests
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Cancelar workflows anteriores del mismo PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Validaciones básicas
  validate:
    name: Validaciones Básicas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar estructura de archivos
        run: |
          echo "✅ Validando estructura del proyecto..."

          # Verificar archivos esenciales
          test -f README.md || (echo "❌ README.md no encontrado" && exit 1)
          test -f LICENSE || (echo "❌ LICENSE no encontrado" && exit 1)
          test -f .gitignore || (echo "❌ .gitignore no encontrado" && exit 1)
          test -f CLAUDE.md || (echo "❌ CLAUDE.md no encontrado" && exit 1)
          test -f WORKFLOW.md || (echo "❌ WORKFLOW.md no encontrado" && exit 1)

          echo "✅ Estructura básica validada"

      - name: Validar que no hay secretos expuestos
        run: |
          echo "🔒 Validando que no hay archivos sensibles..."

          # Verificar que no hay archivos .env committeados
          if git ls-files | grep -E '^\.env'; then
            echo "❌ Archivos .env encontrados en el repositorio"
            exit 1
          fi

          # Verificar que no hay credenciales en archivos
          if git ls-files | grep -i -E 'credentials?\.json|secret|private.*key'; then
            echo "⚠️  Archivos potencialmente sensibles encontrados"
            git ls-files | grep -i -E 'credentials?\.json|secret|private.*key'
            echo "Por favor, revisar manualmente"
          fi

          echo "✅ No se encontraron archivos sensibles obvios"

      - name: Validar formato de documentación
        run: |
          echo "📝 Validando documentación..."

          # Verificar que los archivos .md existen y no están vacíos
          for file in README.md CLAUDE.md WORKFLOW.md; do
            if [ ! -s "$file" ]; then
              echo "❌ $file está vacío o no existe"
              exit 1
            fi
            echo "✅ $file validado"
          done

      - name: Enforce Prisma migrations
        shell: bash
        run: |
          echo "🛡️ Verificando disciplina de Prisma..."

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "ℹ️ No hay base SHA utilizable; se omite enforcement de diff en este evento."
            exit 0
          fi

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" HEAD)"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -q '^apps/api/prisma/schema\.prisma$'; then
            if ! echo "$CHANGED_FILES" | grep -q '^apps/api/prisma/migrations/'; then
              echo "❌ Cambió apps/api/prisma/schema.prisma sin cambios en apps/api/prisma/migrations/"
              echo "Cada cambio de schema debe incluir una migración versionada."
              exit 1
            fi
          fi

          echo "✅ Regla de migraciones Prisma validada"

  # Job 2: Build (se expandirá cuando tengamos código)
  build:
    name: Build del Proyecto
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=@amauta/api
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'

      - name: Validate Prisma schema
        run: cd apps/api && npx prisma validate
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type checking
        run: npm run type-check

      - name: Build
        run: npm run build

      # Tests se activarán cuando tengamos framework de testing configurado
      # - name: Tests
      #   run: npm run test

      # Coverage se activará cuando tengamos tests
      # - name: Coverage
      #   run: npm run test:coverage

  # Job 3: Deploy a producción
  deploy:
    name: Deploy a Producción
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Trigger Dokploy webhook
        run: |
          echo "🚀 Disparando deploy en Dokploy..."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -H "x-github-event: push" \
            -d '{"ref":"refs/heads/master","repository":{"name":"amauta","full_name":"informaticadiaz/amauta"}}')

          HTTP_STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)

          echo "HTTP $HTTP_STATUS: $BODY"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Deploy disparado correctamente"
          else
            echo "❌ Error al disparar el deploy"
            exit 1
          fi

      - name: Esperar healthcheck de API
        run: |
          echo "🩺 Esperando healthcheck de la API..."
          HEALTH_URL="https://amauta-api.diazignacio.ar/health"
          MAX_RETRIES=12
          SLEEP_SECONDS=10

          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Healthcheck OK (HTTP 200)"
              exit 0
            fi
            echo "⏳ Intento $i/$MAX_RETRIES: HTTP $HTTP_CODE"
            sleep "$SLEEP_SECONDS"
          done

          echo "❌ Healthcheck falló después de $((MAX_RETRIES * SLEEP_SECONDS))s"
          exit 1

  # Job 4: Resumen
  summary:
    name: Resumen CI
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: always()

    steps:
      - name: Resumen de ejecución
        run: |
          echo "=================================="
          echo "   Resumen de CI - Amauta"
          echo "=================================="
          echo ""
          echo "✅ Validaciones básicas completadas"
          echo "✅ Dependencias instaladas"
          echo "✅ Formato verificado (Prettier)"
          echo "✅ Lint ejecutado (ESLint)"
          echo "✅ Type checking completado (TypeScript)"
          echo "✅ Build exitoso"
          echo ""
          echo "📋 Próximos pasos:"
          echo "  - Configurar Jest o Vitest para tests"
          echo "  - Configurar Codecov/Coveralls para coverage"
          echo "=================================="
