name: CI

# Triggers: ejecutar en push a main y en pull requests
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Cancelar workflows anteriores del mismo PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Validaciones básicas
  validate:
    name: Validaciones Básicas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar estructura de archivos
        run: |
          echo "✅ Validando estructura del proyecto..."

          # Verificar archivos esenciales
          test -f README.md || (echo "❌ README.md no encontrado" && exit 1)
          test -f LICENSE || (echo "❌ LICENSE no encontrado" && exit 1)
          test -f .gitignore || (echo "❌ .gitignore no encontrado" && exit 1)
          test -f CLAUDE.md || (echo "❌ CLAUDE.md no encontrado" && exit 1)
          test -f WORKFLOW.md || (echo "❌ WORKFLOW.md no encontrado" && exit 1)

          echo "✅ Estructura básica validada"

      - name: Validar que no hay secretos expuestos
        run: |
          echo "🔒 Validando que no hay archivos sensibles..."

          # Verificar que no hay archivos .env committeados
          if git ls-files | grep -E '^\.env'; then
            echo "❌ Archivos .env encontrados en el repositorio"
            exit 1
          fi

          # Verificar que no hay credenciales en archivos
          if git ls-files | grep -i -E 'credentials?\.json|secret|private.*key'; then
            echo "⚠️  Archivos potencialmente sensibles encontrados"
            git ls-files | grep -i -E 'credentials?\.json|secret|private.*key'
            echo "Por favor, revisar manualmente"
          fi

          echo "✅ No se encontraron archivos sensibles obvios"

      - name: Validar formato de documentación
        run: |
          echo "📝 Validando documentación..."

          # Verificar que los archivos .md existen y no están vacíos
          for file in README.md CLAUDE.md WORKFLOW.md; do
            if [ ! -s "$file" ]; then
              echo "❌ $file está vacío o no existe"
              exit 1
            fi
            echo "✅ $file validado"
          done

  # Job 2: Build (se expandirá cuando tengamos código)
  build:
    name: Build del Proyecto
    runs-on: ubuntu-latest
    needs: validate

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=@amauta/api
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type checking
        run: npm run type-check

      - name: Build
        run: npm run build

      # Tests se activarán cuando tengamos framework de testing configurado
      # - name: Tests
      #   run: npm run test

      # Coverage se activará cuando tengamos tests
      # - name: Coverage
      #   run: npm run test:coverage

  # Job 3: Resumen
  summary:
    name: Resumen CI
    runs-on: ubuntu-latest
    needs: [validate, build]
    if: always()

    steps:
      - name: Resumen de ejecución
        run: |
          echo "=================================="
          echo "   Resumen de CI - Amauta"
          echo "=================================="
          echo ""
          echo "✅ Validaciones básicas completadas"
          echo "✅ Dependencias instaladas"
          echo "✅ Formato verificado (Prettier)"
          echo "✅ Lint ejecutado (ESLint)"
          echo "✅ Type checking completado (TypeScript)"
          echo "✅ Build exitoso"
          echo ""
          echo "📋 Próximos pasos:"
          echo "  - Configurar Jest o Vitest para tests"
          echo "  - Configurar Codecov/Coveralls para coverage"
          echo "=================================="
